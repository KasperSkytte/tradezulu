[project]
name = "tradezulu-backend"
version = "0.0.0"
description = "TradeZulu trading journal API"
requires-python = ">=3.10"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = [".venv", "venv", "__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "C4", "SIM"]
ignore = [
    "B008",   # FastAPI dependency defaults are the documented pattern
    "E501",   # long lines are caught by the formatter, not the linter
    "SIM108", # ternaries are not always more readable
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E402"]
