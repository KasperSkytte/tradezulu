name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Test
        working-directory: backend
        env:
          # Keep hashing cheap; the suite logs in dozens of times.
          TZ_BCRYPT_ROUNDS: '4'
        run: pytest -q

  # The orchestrator, the terminal supervisor and the install scripts run on
  # the user's own server, where a mistake surfaces as a terminal that never
  # starts rather than as a failed test.
  terminals:
    name: Orchestrator, terminal and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ruff and pytest
        run: pip install ruff pytest

      # The backend's configuration, so every part is held to one standard.
      # F821 matters most: the supervisor has no test suite to find an
      # undefined name for it, only a terminal that stops on reaching it.
      - name: Lint
        run: ruff check --config backend/pyproject.toml orchestrator/ terminal/

      # Which image an account gets, when a container is replaced, when the
      # weekly restart runs. None of it needs Docker, so none of it goes
      # untested.
      - name: Test the orchestrator
        run: pytest orchestrator/tests -q

      - name: brokers.json is valid and complete
        run: |
          python3 - <<'PY'
          import json
          brokers = {k: v for k, v in json.load(open("brokers.json")).items() if isinstance(v, dict)}
          assert "default" in brokers, "brokers.json needs a default entry"
          for key, entry in brokers.items():
              for field in ("label", "installer", "wine", "matches", "servers"):
                  assert field in entry, f"{key}: missing {field}"
              assert {"branch", "version"} <= set(entry["wine"]), f"{key}: wine needs branch and version"
          print("ok:", ", ".join(brokers))
          PY

      # Every script in the repo, at a version that does not move: a lint that
      # changes with the runner image is a lint that fails on a day nothing
      # changed.
      - name: Lint the shell scripts
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.10.0 \
            $(git ls-files '*.sh')

      # Built, not run: running one needs a broker's MetaTrader, which is
      # downloaded when a terminal image is built on the server.
      - name: Build the orchestrator image
        run: docker build -f orchestrator/Dockerfile -t tradezulu-orchestrator:ci .

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build:only

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tradezulu:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci-${{ github.sha }}

      - name: Smoke test the image
        run: |
          docker run -d --name tradezulu-ci \
            -e TZ_SECRET_KEY=ci-secret-key-not-used-anywhere-else \
            -e TZ_ADMIN_USER=ci \
            -e TZ_ADMIN_PASSWORD=ci-password-for-the-smoke-test \
            -e TZ_INGEST_TOKEN=ci-ingest-token \
            -e TZ_BCRYPT_ROUNDS=4 \
            -p 8420:8420 tradezulu:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8420/api/health >/dev/null; then
              echo "container is healthy"
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "container never became healthy"
              docker logs tradezulu-ci
              exit 1
            fi
            sleep 2
          done

          # The SPA must be served, and the API must reject anonymous callers.
          curl -fsS http://127.0.0.1:8420/ | grep -q "TradeZulu"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8420/api/trades)" = "401"

          # A login must work, and an ingest must produce a trade.
          curl -fsS -c /tmp/jar -X POST http://127.0.0.1:8420/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"ci-password-for-the-smoke-test"}' >/dev/null

          curl -fsS -X POST http://127.0.0.1:8420/api/mt5/ingest \
            -H 'Content-Type: application/json' \
            -H 'X-API-Key: ci-ingest-token' \
            -d '{"account":{"login":"1","server":"CI"},"deals":[
                  {"ticket":1,"position_id":1,"symbol":"EURUSD","type":0,"entry":0,
                   "volume":1,"price":1.1,"sl":1.098,"tp":1.106,
                   "time":"2026-01-02T10:00:00Z","value_per_unit":100000},
                  {"ticket":2,"position_id":1,"symbol":"EURUSD","type":1,"entry":1,
                   "volume":1,"price":1.104,"profit":400,
                   "time":"2026-01-02T12:00:00Z","value_per_unit":100000}]}' >/dev/null

          curl -fsS -b /tmp/jar 'http://127.0.0.1:8420/api/stats/summary?period=all' \
            | grep -q '"win_rate":100'
          echo "smoke test passed"

      - name: Container logs on failure
        if: failure()
        run: docker logs tradezulu-ci || true
