name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        working-directory: backend
        run: pip install -r requirements-dev.txt

      - name: Lint
        working-directory: backend
        run: ruff check .

      - name: Test
        working-directory: backend
        env:
          # Keep hashing cheap; the suite logs in dozens of times.
          TZ_BCRYPT_ROUNDS: '4'
        run: pytest -q

  # The provisioner and the install scripts run on the user's own server, where
  # a mistake surfaces as a failed provisioning cycle rather than a failed test.
  # Neither was checked by anything until a `re.escape` call shipped without the
  # import, which only failed once a terminal reached the point of needing it.
  agent:
    name: Agent and scripts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install ruff and pytest
        run: pip install ruff pytest

      # The backend's configuration, so both halves are held to one standard.
      # F821 is the rule that matters most here: this code has no test suite to
      # find an undefined name for it.
      - name: Lint the provisioner
        run: ruff check --config backend/pyproject.toml agent/

      - name: Check it parses and imports
        run: python -c "import ast, pathlib; [ast.parse(p.read_text()) for p in pathlib.Path('agent').rglob('*.py')]"

      # What the provisioner decides -- when a terminal counts as working, what
      # to do with one that does not, whose prefix is whose. None of it needs
      # Wine, so none of it goes untested.
      - name: Test the provisioner
        run: pytest agent/tests -q

      - name: Lint the shell scripts
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq shellcheck
          shellcheck install.sh uninstall.sh

  frontend:
    name: Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      - name: Type-check
        working-directory: frontend
        run: npm run typecheck

      - name: Build
        working-directory: frontend
        run: npm run build:only

  docker:
    name: Docker image
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v5

      - uses: docker/setup-buildx-action@v3

      - name: Build (no push)
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: tradezulu:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
          build-args: |
            VERSION=ci-${{ github.sha }}

      - name: Smoke test the image
        run: |
          docker run -d --name tradezulu-ci \
            -e TZ_SECRET_KEY=ci-secret-key-not-used-anywhere-else \
            -e TZ_ADMIN_USER=ci \
            -e TZ_ADMIN_PASSWORD=ci-password-for-the-smoke-test \
            -e TZ_INGEST_TOKEN=ci-ingest-token \
            -e TZ_BCRYPT_ROUNDS=4 \
            -p 8420:8420 tradezulu:ci

          for attempt in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:8420/api/health >/dev/null; then
              echo "container is healthy"
              break
            fi
            if [ "$attempt" = "30" ]; then
              echo "container never became healthy"
              docker logs tradezulu-ci
              exit 1
            fi
            sleep 2
          done

          # The SPA must be served, and the API must reject anonymous callers.
          curl -fsS http://127.0.0.1:8420/ | grep -q "TradeZulu"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8420/api/trades)" = "401"

          # A login must work, and an ingest must produce a trade.
          curl -fsS -c /tmp/jar -X POST http://127.0.0.1:8420/api/auth/login \
            -H 'Content-Type: application/json' \
            -d '{"username":"ci","password":"ci-password-for-the-smoke-test"}' >/dev/null

          curl -fsS -X POST http://127.0.0.1:8420/api/mt5/ingest \
            -H 'Content-Type: application/json' \
            -H 'X-API-Key: ci-ingest-token' \
            -d '{"account":{"login":"1","server":"CI"},"deals":[
                  {"ticket":1,"position_id":1,"symbol":"EURUSD","type":0,"entry":0,
                   "volume":1,"price":1.1,"sl":1.098,"tp":1.106,
                   "time":"2026-01-02T10:00:00Z","value_per_unit":100000},
                  {"ticket":2,"position_id":1,"symbol":"EURUSD","type":1,"entry":1,
                   "volume":1,"price":1.104,"profit":400,
                   "time":"2026-01-02T12:00:00Z","value_per_unit":100000}]}' >/dev/null

          curl -fsS -b /tmp/jar 'http://127.0.0.1:8420/api/stats/summary?period=all' \
            | grep -q '"win_rate":100'
          echo "smoke test passed"

      - name: Container logs on failure
        if: failure()
        run: docker logs tradezulu-ci || true
