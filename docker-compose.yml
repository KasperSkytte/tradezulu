# TradeZulu — copy .env.example to .env, edit it, then:
#
#   docker compose up -d
#
# That is the whole site: journal, copier and API. MetaTrader itself runs on
# the host rather than in a container -- see install.sh, which sets both up.

services:
  tradezulu:
    # Built locally by default. Once the repository is on GitHub, a release
    # publishes this same image and `docker compose pull` will fetch it.
    image: ghcr.io/${TZ_IMAGE_OWNER:-local}/tradezulu:${TZ_IMAGE_TAG:-latest}
    build:
      context: .
      args:
        # Unset is fine: the image falls back to version.txt, which
        # release-please keeps current.
        VERSION: ${TZ_VERSION:-}
    container_name: tradezulu
    restart: unless-stopped
    env_file: .env
    environment:
      # Everything else comes from .env; these keep the container coherent.
      TZ_DATA_DIR: /data
      TZ_DATABASE_URL: sqlite:////data/tradezulu.db
      TZ_STATIC_DIR: /app/static
      PORT: 8420
    ports:
      # Bound to localhost: nginx on the host is what faces the network, and
      # the MetaTrader terminals reach this address directly.
      - "127.0.0.1:${TZ_PORT:-8420}:8420"
    volumes:
      - tradezulu-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8420/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

volumes:
  tradezulu-data:
