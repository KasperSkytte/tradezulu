# TradeZulu — copy .env.example to .env, edit it, then: docker compose up -d
#
# The default setup is a single container. The optional MetaTrader 5 bridge
# only starts when you ask for it:
#
#   docker compose --profile bridge up -d

services:
  tradezulu:
    # Built locally by default. Once the repository is on GitHub, a release
    # publishes this same image and `docker compose pull` will fetch it.
    image: ghcr.io/${TZ_IMAGE_OWNER:-local}/tradezulu:${TZ_IMAGE_TAG:-latest}
    build:
      context: .
      args:
        VERSION: ${TZ_VERSION:-dev}
    container_name: tradezulu
    restart: unless-stopped
    env_file: .env
    environment:
      # Everything else comes from .env; these keep the container coherent.
      TZ_DATA_DIR: /data
      TZ_DATABASE_URL: sqlite:////data/tradezulu.db
      TZ_STATIC_DIR: /app/static
      PORT: 8420
    ports:
      # Bound to localhost: nginx on the host is what faces the network.
      - "127.0.0.1:${TZ_PORT:-8420}:8420"
    volumes:
      - tradezulu-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8420/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # Optional: a headless MetaTrader 5 under Wine so the server can *pull*
  # deals. Only needed if you cannot run the TradeZuluSync Expert Advisor.
  # Heavy (a few GB) and slow on first boot.
  mt5-bridge:
    profiles: ["bridge"]
    build:
      context: ./mt5-bridge
    image: tradezulu-mt5-bridge:local
    container_name: tradezulu-mt5-bridge
    restart: unless-stopped
    environment:
      MT5_LOGIN: ${MT5_LOGIN:-}
      # Use the broker's *investor* password: it is read-only, so this
      # container cannot place a trade even if something goes wrong.
      MT5_PASSWORD: ${MT5_PASSWORD:-}
      MT5_SERVER: ${MT5_SERVER:-}
      BRIDGE_PORT: 8080
    volumes:
      - mt5-wine:/wine
    expose:
      - "8080"
    # Never publish this port to the network; only TradeZulu should reach it.

volumes:
  tradezulu-data:
  mt5-wine:
