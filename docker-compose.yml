# TradeZulu — copy .env.example to .env, edit it, then:
#
#   docker compose --profile bridge up -d       journal + MetaTrader terminal
#   docker compose up -d                        journal only
#
# The bridge is the container that lets you sync with nothing but a server, an
# account number and an investor password. Leave it out only if you would
# rather run the TradeZuluSync Expert Advisor in a terminal of your own.

services:
  tradezulu:
    # Built locally by default. Once the repository is on GitHub, a release
    # publishes this same image and `docker compose pull` will fetch it.
    image: ghcr.io/${TZ_IMAGE_OWNER:-local}/tradezulu:${TZ_IMAGE_TAG:-latest}
    build:
      context: .
      args:
        VERSION: ${TZ_VERSION:-dev}
    container_name: tradezulu
    restart: unless-stopped
    env_file: .env
    environment:
      # Everything else comes from .env; these keep the container coherent.
      TZ_DATA_DIR: /data
      TZ_DATABASE_URL: sqlite:////data/tradezulu.db
      TZ_STATIC_DIR: /app/static
      PORT: 8420
      TZ_BRIDGE_TOKEN: ${TZ_BRIDGE_TOKEN:-}
    ports:
      # Bound to localhost: nginx on the host is what faces the network.
      - "127.0.0.1:${TZ_PORT:-8420}:8420"
    volumes:
      - tradezulu-data:/data
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8420/api/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s

  # A headless MetaTrader 5 under Wine. MetaTrader's protocol is proprietary,
  # so a real terminal is the only way to reach an account with just a server,
  # a login and a password -- this is that terminal, kept out of sight.
  #
  # Your account details are entered in the TradeZulu UI, not here: they are
  # stored encrypted in the journal and handed over on connect.
  mt5-bridge:
    profiles: ["bridge"]
    build:
      context: ./mt5-bridge
    image: tradezulu-mt5-bridge:local
    container_name: tradezulu-mt5-bridge
    restart: unless-stopped
    environment:
      BRIDGE_PORT: 8080
      TZ_BRIDGE_TOKEN: ${TZ_BRIDGE_TOKEN:-}
      BRIDGE_TOKEN: ${TZ_BRIDGE_TOKEN:-}
      # Set to 1 and publish 5900 if a broker ever needs a dialog answered.
      ENABLE_VNC: ${MT5_ENABLE_VNC:-0}
      # Only needed for a broker whose build the generic installer cannot fetch.
      MT5_SETUP_URL: ${MT5_SETUP_URL:-}
    volumes:
      # Holds Wine, the terminal and its cache. Keep it: a fresh one means
      # another 5-15 minute first boot.
      - mt5-wine:/wine
    expose:
      - "8080"
    # Deliberately not published: only TradeZulu should be able to reach it.

volumes:
  tradezulu-data:
  mt5-wine:
